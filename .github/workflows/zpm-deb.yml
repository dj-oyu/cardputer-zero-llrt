name: Build zpm (.deb for arm64)

on:
  push:
    branches: [main]
    paths:
      - 'crates/cz-zpm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-zpm-deb.sh'
      - '.github/workflows/zpm-deb.yml'
    tags:
      - 'zpm-v*'
      - 'v*'
  pull_request:
    paths:
      - 'crates/cz-zpm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-zpm-deb.sh'
      - '.github/workflows/zpm-deb.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Debian package version (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compile & dpkg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dpkg-dev curl

      - name: Setup Rust toolchain (with aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cz-zpm unit tests
        run: cargo test -p cz-zpm -- --test-threads=1

      - name: Resolve package version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/zpm-v* ]]; then
            V="${GITHUB_REF_NAME#zpm-v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            V="${BASE}+git.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved .deb version: $V"

      - name: Build cardputer-zero-zpm arm64 .deb
        run: bash scripts/build-zpm-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-zero-zpm-${{ steps.ver.outputs.version }}-arm64
          path: |
            dist/cardputer-zero-zpm_*.deb
            dist/cardputer-zero-zpm_*.deb.sha256

      - name: Attach .deb to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cardputer-zero-zpm_*.deb
            dist/cardputer-zero-zpm_*.deb.sha256
