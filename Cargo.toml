[workspace]
resolver = "2"
members = [
    "crates/cz-json",
    "crates/cz-hal",
    "crates/cz-gfx",
    "crates/cz-modules",
    "crates/cz-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.dependencies]
libc = "0.2"
rquickjs = { version = "0.14", features = ["std", "classes", "array-buffer", "loader"] }
swash = "0.2"
read-fonts = { version = "0.41", default-features = false, features = ["std"] }
