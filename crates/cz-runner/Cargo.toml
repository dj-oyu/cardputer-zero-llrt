[package]
name = "cz-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cz-js"
path = "src/main.rs"

[dependencies]
cz-modules = { path = "../cz-modules" }
# Phase 14: unified multicall `cz-js` binary (cz-js / node / zpm / npm). The native zpm CLI is
# dispatched at the very start of main(), BEFORE any QuickJS `Runtime` exists.
cz-zpm = { path = "../cz-zpm" }
rquickjs.workspace = true

[dev-dependencies]
cz-gfx = { path = "../cz-gfx" }
cz-net = { path = "../cz-net" }
cz-hal = { path = "../cz-hal" }
cz-json = { path = "../cz-json" }
