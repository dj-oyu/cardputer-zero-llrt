[package]
name = "cz-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cz-hal = { path = "../cz-hal" }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Phase 14: ureq's plain `rustls` feature bundles Mozilla roots (`webpki-roots`) into
# Cargo.lock. This workspace must stay 100% free of `tokio`, `hyper`, `hyper-util`,
# `hyper-rustls` and `webpki-roots`, so we take `rustls-no-provider` instead: every TLS
# connection flows through `cz_net::tls::build_client_config` (system CA + ring) over the
# custom `CzConnector`, which never consults ureq's bundled root store.
rustls-native-certs = "0.8"
rustls-pemfile = "2"
http = "1"
libc.workspace = true
# Phase 11: RFC 6455 handshake/accept hashing and mask keys use `ring` only (already resolved in
# Cargo.lock through rustls); NO OpenSSL/native-tls/async-runtime/WebSocket crates are added.
ring = "0.17"

[dev-dependencies]
