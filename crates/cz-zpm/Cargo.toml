[package]
name = "cz-zpm"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cz-zpm"
path = "src/main.rs"

[dependencies]
# Phase 14: 100% Tokio/Hyper/webpki-roots-free synchronous HTTP. `cz-net` supplies the shared
# ureq transport (system CA + ring via `cz_net::tls::build_client_config`) through
# `sync_agent`, and `ureq` is taken WITHOUT its bundled Mozilla roots (`rustls-no-provider`
# instead of `rustls`, which would re-add `webpki-roots` to Cargo.lock). ZERO new crates vs.
# what `cz-js`/`cz-net` already resolve.
cz-net = { path = "../cz-net" }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "gzip"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
